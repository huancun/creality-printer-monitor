<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <title>登录 · 创想打印机监控</title>
  <link rel="stylesheet" href="/static/style.css?v=11">
  <style>
    .auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .auth-card { width: min(380px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 30px 28px; display: flex; flex-direction: column; gap: 16px; }
    .auth-brand { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .auth-brand .logo { width: 26px; height: 26px; color: var(--accent); }
    .auth-brand h1 { font-size: 17px; }
    .auth-sub { text-align: center; color: var(--muted); font-size: 13px; margin: -8px 0 0; }
    .auth-form { display: flex; flex-direction: column; gap: 12px; }
    .auth-form label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--text-2); }
    .auth-err { background: rgba(240, 96, 90, .12); border: 1px solid rgba(240, 96, 90, .4); color: var(--danger); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
    .auth-note { color: var(--muted); font-size: 12.5px; line-height: 1.6; background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand">
        <svg viewBox="0 0 24 24" class="logo" aria-hidden="true"><path d="M4 20h16M6 20V9l6-5 6 5v11M9 20v-6h6v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <h1>创想打印机监控</h1>
      </div>
      <p class="auth-sub" id="auth-sub">登录以继续</p>

      <form id="login-form" class="auth-form" hidden>
        <label>用户名
          <input name="username" autocomplete="username" autocapitalize="none" required autofocus>
        </label>
        <label>密码
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="btn primary wide" type="submit">登录</button>
      </form>

      <form id="setup-form" class="auth-form" hidden>
        <p class="auth-note">首次使用，请创建管理员账号。<br>
          <b>管理员</b>可使用全部功能；<b>普通用户</b>只能查看监控、耗材、打印任务、温度和最近打印。</p>
        <label>管理员用户名
          <input name="username" autocomplete="username" autocapitalize="none" required autofocus>
        </label>
        <label>密码（至少 6 位）
          <input name="password" type="password" autocomplete="new-password" minlength="6" required>
        </label>
        <label>确认密码
          <input name="password2" type="password" autocomplete="new-password" minlength="6" required>
        </label>
        <button class="btn primary wide" type="submit">创建管理员并登录</button>
      </form>

      <p class="auth-err" id="auth-err" hidden></p>
    </div>
  </main>

  <script>
    const $ = (s) => document.querySelector(s);
    const loginForm = $("#login-form");
    const setupForm = $("#setup-form");
    const errEl = $("#auth-err");

    function showErr(msg) {
      errEl.textContent = msg || "";
      errEl.hidden = !msg;
    }

    async function post(url, body) {
      const r = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        const err = new Error(data.detail || `请求失败（${r.status}）`);
        err.status = r.status;
        throw err;
      }
      return data;
    }

    async function boot() {
      const [need, me] = await Promise.all([
        fetch("/api/auth/need-setup").then((r) => r.json()).catch(() => ({ setup: false })),
        fetch("/api/auth/me").then((r) => (r.ok ? r.json() : null)).catch(() => null),
      ]);
      if (me) { location.replace("/"); return; }
      if (need.setup) {
        $("#auth-sub").textContent = "首次使用：创建管理员账号";
        setupForm.hidden = false;
      } else {
        loginForm.hidden = false;
      }
    }

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      showErr("");
      const f = new FormData(loginForm);
      try {
        await post("/api/auth/login", { username: f.get("username"), password: f.get("password") });
        location.replace("/");
      } catch (err) {
        showErr(err.message);
      }
    });

    setupForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      showErr("");
      const f = new FormData(setupForm);
      if (f.get("password") !== f.get("password2")) {
        showErr("两次输入的密码不一致");
        return;
      }
      try {
        await post("/api/auth/setup", { username: f.get("username"), password: f.get("password") });
        location.replace("/");
      } catch (err) {
        if (err.status === 409) {  // someone finished the setup meanwhile
          setupForm.hidden = true;
          $("#auth-sub").textContent = "管理员已创建，请登录";
          loginForm.hidden = false;
          showErr(err.message);
          return;
        }
        showErr(err.message);
      }
    });

    boot();
  </script>
</body>
</html>
